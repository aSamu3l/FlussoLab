# Builds the server image and publishes it on GitHub Packages (ghcr.io/asamu3l/flussolab-server).
# The engine (core/core.js) is always taken from the main branch, so server and app check programs the same way.
name: Server image
on:
  push:
    branches: [server]
    tags: ['server-v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine from main
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/js/core.js -o core/core.js
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Tests
        run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/asamu3l/flussolab-server:latest
            ghcr.io/asamu3l/flussolab-server:${{ steps.v.outputs.version }}
